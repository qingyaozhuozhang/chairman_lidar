controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001   # 修复参考配置中的0.5，防止Y轴无法启动
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 10.0
      
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.03
      yaw_goal_tolerance: 0.03
    
    # ====== 完美的万向轮 PID 纯跟踪控制器 ======
    FollowPath:
      plugin: "pb_omni_pid_pursuit_controller::OmniPidPursuitController"
      
      # 核心平移 PID（控制小车吸附在路径上）
      translation_kp: 5.0
      translation_ki: 0.0
      translation_kd: 0.0
      
      # 核心旋转 PID（控制小车边走边转的丝滑度）
      enable_rotation: true           # 【修复】必须开启，否则不会边走边转
      rotation_kp: 4.0
      rotation_ki: 0.0
      rotation_kd: 0.0
      
      transform_tolerance: 1.0        # 【核心修复】彻底杜绝 Extrapolation 报错
      min_max_sum_error: 1.0
      
      # 纯跟踪前瞻距离参数（越大走得越平滑，越小越贴合路径）
      lookahead_dist: 0.3
      use_velocity_scaled_lookahead_dist: true
      lookahead_time: 0.5
      min_lookahead_dist: 0.15
      max_lookahead_dist: 1.2
      
      use_interpolation: true
      use_rotate_to_heading: true     # 保留边走边转
      rotate_to_goal_heading_only: true  # 只追最终目标姿态，不追 Navfn path 中间点姿态，避免无障碍直线绕圈
      yaw_hold_tolerance: 0.01        # 当前车头与目标车头误差小于约4.6°时，不输出角速度
      use_rotate_to_heading_treshold: 0.1
      min_approach_linear_velocity: 0.08
      # 新增：最小驱动自转角速度。yaw误差还没进容差时，如果PID算出的wz太小，就补到这个值。
      min_approach_angular_velocity: 0.1
      # 新增：角速度最小补偿的误差门槛。小于该yaw误差时允许wz=0，避免终点来回摆。
      min_approach_angular_velocity_tolerance: 0.01
      approach_velocity_scaling_dist: 0.30
      
      # 全向轮速度限制
      v_linear_min: -1.5              # 根据你的底盘能力调整
      v_linear_max: 1.5
      v_angular_min: -2.0
      v_angular_max: 2.0
      
      # 根据路径曲率动态减速（完美解决弯道/绕障时冲出路径的问题）
      curvature_min: 0.4
      curvature_max: 0.7
      reduction_ratio_at_high_curvature: 0.5
      curvature_forward_dist: 0.7
      curvature_backward_dist: 0.3
      max_velocity_scaling_factor_rate: 0.9

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: True
      transform_tolerance: 1.0       # 防止清空地图时报错
      rolling_window: true
      # 【核心修复】将 1x1 扩大到 5x5，让全向轮控制器能提前看到障碍并平滑绕开
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[[0.35,0.3],[0.35,-0.3],[-0.35,-0.3],[-0.35,0.3]]"
      plugins: ["static_layer", "intensity_voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 1.2
        inflation_radius: 0.0
      intensity_voxel_layer:
        plugin: pb_nav2_costmap_2d::IntensityVoxelLayer
        enabled: true
        track_unknown_space: true
        footprint_clearing_enabled: true
        publish_voxel_map: false
        combination_method: 1
        mark_threshold: 0
        origin_z: 0.0
        unknown_threshold: 5
        z_resolution: 0.40
        z_voxels: 16
        min_obstacle_height: -2.5
        max_obstacle_height: 2.0
        min_obstacle_intensity: 0.1
        max_obstacle_intensity: 2.0
        observation_sources: terrain_map
        terrain_map:
          data_type: PointCloud2
          topic: /terrain_map
          sensor_frame: odom
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: True
      transform_tolerance: 1.0
      footprint: "[[0.35,0.3],[0.35,-0.3],[-0.35,-0.3],[-0.35,0.3]]"
      track_unknown_space: true
      plugins: ["static_layer", "intensity_voxel_layer", "inflation_layer"]
      intensity_voxel_layer:
        plugin: pb_nav2_costmap_2d::IntensityVoxelLayer
        enabled: true
        track_unknown_space: true
        footprint_clearing_enabled: true
        publish_voxel_map: false
        combination_method: 1
        mark_threshold: 0
        origin_z: 0.0
        unknown_threshold: 5
        z_resolution: 0.40
        z_voxels: 16
        min_obstacle_height: -5.0
        max_obstacle_height: 5.0
        min_obstacle_intensity: 0.1
        max_obstacle_intensity: 2.0
        observation_sources: terrain_map_ext
        terrain_map_ext:
          data_type: PointCloud2
          topic: /terrain_map_ext
          sensor_frame: odom
          min_obstacle_height: 0.0
          max_obstacle_height: 5.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 1.2
        inflation_radius: 0.0
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 1.0
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [1.5, 1.5, 1.5]
    min_velocity: [-1.5, -1.5, -1.5]
    max_accel: [1.5, 1.5, 2.0]
    max_decel: [-3.0, -3.0, -4.0]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
