controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001   # 修复参考配置中的0.5，防止Y轴无法启动
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.02
      movement_time_allowance: 20.0
      
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.01
      yaw_goal_tolerance: 0.01
    
    # ====== 完美的万向轮 PID 纯跟踪控制器 ======
    FollowPath:
      plugin: "pb_omni_pid_pursuit_controller::OmniPidPursuitController"
      
      # 核心平移 PID（控制小车吸附在路径上）
      translation_kp: 3.0
      translation_ki: 0.0
      translation_kd: 0.0
      
      # 核心旋转 PID（控制小车边走边转的丝滑度）
      enable_rotation: true           # 【修复】必须开启，否则不会边走边转
      rotation_kp: 1.0
      rotation_ki: 0.0
      rotation_kd: 0.0
      
      transform_tolerance: 1.0        # 【核心修复】彻底杜绝 Extrapolation 报错
      min_max_sum_error: 1.0
      
      # 纯跟踪前瞻距离参数（越大走得越平滑，越小越贴合路径）
      lookahead_dist: 0.3
      use_velocity_scaled_lookahead_dist: true
      lookahead_time: 0.5
      min_lookahead_dist: 0.15
      max_lookahead_dist: 1.2
      
      use_interpolation: true
      use_rotate_to_heading: true     # 到达终点时精准对齐角度
      use_rotate_to_heading_treshold: 0.1
      min_approach_linear_velocity: 0.05
      # 新增：最小驱动自转角速度。yaw误差还没进容差时，如果PID算出的wz太小，就补到这个值。
      min_approach_angular_velocity: 0.05
      # 新增：角速度最小补偿的误差门槛。小于该yaw误差时允许wz=0，避免终点来回摆。
      min_approach_angular_velocity_tolerance: 0.01

      # 终点容差内直接清零：没到点保持最小可驱动速度，到点后 controller 直接输出 0。
      enable_final_pose_zero_stop: false
      final_xy_goal_tolerance: 0.005  # controller内部不再用它判成功，仅保留为调试参数
      final_yaw_goal_tolerance: 0.02  # controller内部不再用它判成功，仅保留为调试参数

      approach_velocity_scaling_dist: 0.3
      
      # 全向轮速度限制
      v_linear_min: -1.0              # 根据你的底盘能力调整
      v_linear_max: 1.0
      v_angular_min: -1.0
      v_angular_max: 1.0
      
      # 根据路径曲率动态减速（完美解决弯道/绕障时冲出路径的问题）
      curvature_min: 0.4
      curvature_max: 0.7
      reduction_ratio_at_high_curvature: 0.5
      curvature_forward_dist: 0.7
      curvature_backward_dist: 0.3
      max_velocity_scaling_factor_rate: 0.9

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: True
      transform_tolerance: 1.0       # 防止清空地图时报错
      rolling_window: true
      # 【核心修复】将 1x1 扩大到 5x5，让全向轮控制器能提前看到障碍并平滑绕开
      width: 5
      height: 5
      resolution: 0.05
      footprint: "[[0.35,0.3],[0.35,-0.3],[-0.35,-0.3],[-0.35,0.3]]"
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.5
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan1
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: True
      transform_tolerance: 1.0
      footprint: "[[0.35,0.3],[0.35,-0.3],[-0.35,-0.3],[-0.35,0.3]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan1
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.5
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 1.0
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [1.0, 1.0, 1.0]
    min_velocity: [-1.0, -1.0, -1.0]
    max_accel: [0.5, 0.5, 1.0]
    max_decel: [-0.5, -0.5, -1.0]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0