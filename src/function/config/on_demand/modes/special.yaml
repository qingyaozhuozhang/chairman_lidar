# 特殊任务的本地手写控制参数；不向运行中的 Nav2 下发。
# parameters：普通定距移动、旋转、登阶；uphill_parameters：沿地图 X 方向上坡。
# 两组都完整保留 controller_server / velocity_smoother 的 Nav2 名称和层级。
# 标记“对照项”的字段仅供对照 Nav2 结构，本手写控制器不读取；其余字段实际生效。
# min_approach_* 是接近目标时的最小速度幅值，不能用负向速度下限 v_*_min 替代。
# max_decel 按 Nav2 约定填写负值；手写控制内部使用其幅值计算制动。
# controller_frequency 决定阻塞式手写循环周期；登阶定时器由通信节点按 50 Hz 调度。
# 同步配置后重启 Function sum 生效。

# 普通移动 / 旋转 / 登阶
parameters:
  controller_server:
    ros__parameters:
      use_sim_time: true  # 对照项
      controller_frequency: 50.0
      min_x_velocity_threshold: 0.001  # 对照项
      min_y_velocity_threshold: 0.001  # 对照项
      min_theta_velocity_threshold: 0.001  # 对照项
      failure_tolerance: 0.3  # 对照项
      progress_checker_plugin: progress_checker  # 对照项
      goal_checker_plugins: [general_goal_checker]  # 对照项
      controller_plugins: [FollowPath]  # 对照项
      progress_checker:
        plugin: nav2_controller::SimpleProgressChecker  # 对照项
        required_movement_radius: 0.1  # 对照项
        movement_time_allowance: 10.0  # 对照项
      general_goal_checker:
        stateful: true  # 对照项
        plugin: nav2_controller::SimpleGoalChecker  # 对照项
        xy_goal_tolerance: 0.005
        yaw_goal_tolerance: 0.01
      FollowPath:
        plugin: pb_omni_pid_pursuit_controller::OmniPidPursuitController  # 对照项
        translation_kp: 0.5
        translation_ki: 0.0  # 对照项
        translation_kd: 0.0  # 对照项
        enable_rotation: true  # 对照项
        rotation_kp: 3.0
        rotation_ki: 0.0  # 对照项
        rotation_kd: 0.0  # 对照项
        transform_tolerance: 1.0  # 对照项
        min_max_sum_error: 1.0  # 对照项
        lookahead_dist: 0.3  # 对照项
        use_velocity_scaled_lookahead_dist: true  # 对照项
        lookahead_time: 0.5  # 对照项
        min_lookahead_dist: 0.15  # 对照项
        max_lookahead_dist: 1.2  # 对照项
        use_interpolation: true  # 对照项
        use_rotate_to_heading: true  # 对照项
        rotate_to_goal_heading_only: true  # 对照项
        yaw_hold_tolerance: 0.01  # 对照项
        use_rotate_to_heading_treshold: 0.1  # 对照项
        min_approach_linear_velocity: 0.05
        min_approach_angular_velocity: 0.1
        min_approach_angular_velocity_tolerance: 0.01  # 对照项
        approach_velocity_scaling_dist: 0.3  # 对照项
        v_linear_min: -0.5  # 对照项
        v_linear_max: 0.5
        v_angular_min: -1.5  # 对照项
        v_angular_max: 1.5
        curvature_min: 0.4  # 对照项
        curvature_max: 0.7  # 对照项
        reduction_ratio_at_high_curvature: 0.5  # 对照项
        curvature_forward_dist: 0.7  # 对照项
        curvature_backward_dist: 0.3  # 对照项
        max_velocity_scaling_factor_rate: 0.9  # 对照项
  velocity_smoother:
    ros__parameters:
      use_sim_time: true  # 对照项
      smoothing_frequency: 20.0  # 对照项
      scale_velocities: false  # 对照项
      feedback: OPEN_LOOP  # 对照项
      max_velocity: [0.5, 0.5, 1.5]  # 对照项
      min_velocity: [-0.5, -0.5, -1.5]  # 对照项
      max_accel: [0.5, 0.5, 3.0]
      max_decel: [-0.5, -0.5, -3.0]
      odom_topic: odom  # 对照项
      odom_duration: 0.1  # 对照项
      deadband_velocity: [0.0, 0.0, 0.0]  # 对照项
      velocity_timeout: 1.0  # 对照项
  # 本功能专用：航向纠偏、横向纠偏及距离/检测条件。
  simple_nav_node:
    ros__parameters:
      yaw_correction:
        rotation_kp: 1.0
        max_velocity_ratio: 0.5
      cross_track:
        translation_kp: 1.0
        v_linear_max: 0.1
        min_approach_linear_velocity: 0.01
        xy_goal_tolerance: 0.005
      lift_check_height: 0.5

# 上坡：独立的速度、增益、纠偏和停止条件
uphill_parameters:
  controller_server:
    ros__parameters:
      use_sim_time: true  # 对照项
      controller_frequency: 20.0  # 对照项
      min_x_velocity_threshold: 0.001  # 对照项
      min_y_velocity_threshold: 0.001  # 对照项
      min_theta_velocity_threshold: 0.001  # 对照项
      failure_tolerance: 0.3  # 对照项
      progress_checker_plugin: progress_checker  # 对照项
      goal_checker_plugins: [general_goal_checker]  # 对照项
      controller_plugins: [FollowPath]  # 对照项
      progress_checker:
        plugin: nav2_controller::SimpleProgressChecker  # 对照项
        required_movement_radius: 0.1  # 对照项
        movement_time_allowance: 10.0  # 对照项
      general_goal_checker:
        stateful: true  # 对照项
        plugin: nav2_controller::SimpleGoalChecker  # 对照项
        xy_goal_tolerance: 0.01
        yaw_goal_tolerance: 0.01
      FollowPath:
        plugin: pb_omni_pid_pursuit_controller::OmniPidPursuitController  # 对照项
        translation_kp: 2.0
        translation_ki: 0.0  # 对照项
        translation_kd: 0.0  # 对照项
        enable_rotation: true  # 对照项
        rotation_kp: 4.0  # 对照项
        rotation_ki: 0.0  # 对照项
        rotation_kd: 0.0  # 对照项
        transform_tolerance: 1.0  # 对照项
        min_max_sum_error: 1.0  # 对照项
        lookahead_dist: 0.3  # 对照项
        use_velocity_scaled_lookahead_dist: true  # 对照项
        lookahead_time: 0.5  # 对照项
        min_lookahead_dist: 0.15  # 对照项
        max_lookahead_dist: 1.2  # 对照项
        use_interpolation: true  # 对照项
        use_rotate_to_heading: true  # 对照项
        rotate_to_goal_heading_only: true  # 对照项
        yaw_hold_tolerance: 0.01  # 对照项
        use_rotate_to_heading_treshold: 0.1  # 对照项
        min_approach_linear_velocity: 0.05
        min_approach_angular_velocity: 0.05
        min_approach_angular_velocity_tolerance: 0.01  # 对照项
        approach_velocity_scaling_dist: 0.3  # 对照项
        v_linear_min: -2.0  # 对照项
        v_linear_max: 2.0
        v_angular_min: -1.0  # 对照项
        v_angular_max: 1.0
        curvature_min: 0.4  # 对照项
        curvature_max: 0.7  # 对照项
        reduction_ratio_at_high_curvature: 0.5  # 对照项
        curvature_forward_dist: 0.7  # 对照项
        curvature_backward_dist: 0.3  # 对照项
        max_velocity_scaling_factor_rate: 0.9  # 对照项
  velocity_smoother:
    ros__parameters:
      use_sim_time: true  # 对照项
      smoothing_frequency: 20.0  # 对照项
      scale_velocities: false  # 对照项
      feedback: OPEN_LOOP  # 对照项
      max_velocity: [2.0, 2.0, 1.0]  # 对照项
      min_velocity: [-2.0, -2.0, -1.0]  # 对照项
      max_accel: [1.0, 1.0, 1.0]
      max_decel: [-2.0, -2.0, -1.0]
      odom_topic: odom  # 对照项
      odom_duration: 0.1  # 对照项
      deadband_velocity: [0.0, 0.0, 0.0]  # 对照项
      velocity_timeout: 1.0  # 对照项
  # 本功能专用：航向纠偏、横向纠偏及距离/检测条件。
  simple_nav_node:
    ros__parameters:
      yaw_correction:
        rotation_kp: 1.0
        max_velocity_ratio: 0.5
      cross_track:
        translation_kp: 1.5
        v_linear_max: 1.0
        min_approach_linear_velocity: 0.05
        xy_goal_tolerance: 0.01
      global_x_distance: 2.7
      timeout: 20.0
